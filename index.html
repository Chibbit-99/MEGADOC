<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MegaDoc — All your notes in one document</title>
<meta name="description" content="MegaDoc is a software for putting all your notes in one document when you are too lazy to manage 15 billion of them." />
<link rel="icon" type="image/svg+xml" href="assets/megadoc.svg" />
<link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>

<!-- ══════════ TOP BAR ══════════ -->
<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn logo-btn" id="logoBtn" title="MegaDoc home" aria-label="MegaDoc home">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="34" height="34">
          <path class="logo-fill" d="M5 11a2 2 0 0 1 2-2h3v23h18v2H8a3 3 0 0 1-3-3z" opacity=".36"/>
          <path class="logo-fill" d="M12 5h14l7 7v20a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"/>
          <path d="M26 5v5a2 2 0 0 0 2 2h5z" fill="#fff" opacity=".46"/>
          <path d="M15 17v11m0-8h5m-5 8h5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="21" y="18" width="6" height="4" rx="1" fill="#fff"/>
          <rect x="21" y="26" width="6" height="4" rx="1" fill="#fff" opacity=".75"/>
        </svg>
      </span>
    </button>
    <div class="doc-title-wrap">
      <input id="docTitle" class="doc-title" value="MegaDoc" spellcheck="false" aria-label="Document title" />
    </div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="historyBtn" title="Version history" aria-label="Version history"><span class="material-symbols-outlined">history</span></button>
    <button class="icon-btn" id="commentBtn" title="Comments" aria-label="Comments"><span class="material-symbols-outlined">comment</span></button>
    <div class="share-wrap">
      <button class="share-btn" id="shareBtn"><span class="material-symbols-outlined">lock</span><span>Share</span></button>
      <button class="share-arrow" id="shareArrow" aria-label="Share options"><span class="material-symbols-outlined">arrow_drop_down</span></button>
    </div>
    <button class="avatar" id="avatarBtn" title="Account" aria-label="Account">M</button>
  </div>
</header>

<!-- ══════════ MENU BAR ══════════ -->
<nav class="menubar" id="menubar" aria-label="Main menu"></nav>

<!-- ══════════ TOOLBAR ══════════ -->
<div class="toolbar" id="toolbar">
  <div class="toolbar-scroll">
    <button class="menus-search" id="menusSearch" title="Search menus (Ctrl+/)">
      <span class="material-symbols-outlined">search</span><span>Menus</span>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-cmd="undo" title="Undo (Ctrl+Z)"><span class="material-symbols-outlined">undo</span></button>
    <button class="tb-btn" data-cmd="redo" title="Redo (Ctrl+Y)"><span class="material-symbols-outlined">redo</span></button>
    <button class="tb-btn" data-cmd="print" title="Print (Ctrl+P)"><span class="material-symbols-outlined">print</span></button>
    <button class="tb-btn" data-cmd="spellcheck" title="Spelling and grammar"><span class="material-symbols-outlined">spellcheck</span></button>
    <button class="tb-btn" data-cmd="paint" title="Paint format"><span class="material-symbols-outlined">format_paint</span></button>
    <span class="tb-sep"></span>

    <div class="tb-dropdown" data-dropdown="zoom">
      <button class="tb-select" id="zoomBtn"><span id="zoomLabel">100%</span><span class="material-symbols-outlined caret">arrow_drop_down</span></button>
      <div class="tb-menu" id="zoomMenu">
        <button data-zoom="50">50%</button>
        <button data-zoom="75">75%</button>
        <button data-zoom="90">90%</button>
        <button data-zoom="100" class="active">100%</button>
        <button data-zoom="125">125%</button>
        <button data-zoom="150">150%</button>
        <button data-zoom="200">200%</button>
      </div>
    </div>
    <span class="tb-sep"></span>

    <div class="tb-dropdown" data-dropdown="style">
      <button class="tb-select wide" id="styleBtn"><span id="styleLabel">Normal text</span><span class="material-symbols-outlined caret">arrow_drop_down</span></button>
      <div class="tb-menu" id="styleMenu">
        <button data-style="p" class="active"><span class="st-normal">Normal text</span></button>
        <button data-style="h1"><span class="st-h1">Heading 1</span></button>
        <button data-style="h2"><span class="st-h2">Heading 2</span></button>
        <button data-style="h3"><span class="st-h3">Heading 3</span></button>
        <button data-style="h4"><span class="st-h4">Heading 4</span></button>
        <button data-style="h5"><span class="st-h5">Heading 5</span></button>
        <button data-style="h6"><span class="st-h6">Heading 6</span></button>
        <button data-style="blockquote"><span class="st-quote">Quote</span></button>
        <button data-style="code"><span class="st-code">Code</span></button>
      </div>
    </div>
    <span class="tb-sep"></span>

    <div class="tb-dropdown" data-dropdown="font">
      <button class="tb-select" id="fontBtn"><span id="fontLabel">Arial</span><span class="material-symbols-outlined caret">arrow_drop_down</span></button>
      <div class="tb-menu" id="fontMenu">
        <button data-font="Arial" class="active" style="font-family:Arial">Arial</button>
        <button data-font="Roboto" style="font-family:Roboto">Roboto</button>
        <button data-font="Georgia" style="font-family:Georgia">Georgia</button>
        <button data-font="Times New Roman" style="font-family:'Times New Roman'">Times New Roman</button>
        <button data-font="Courier New" style="font-family:'Courier New'">Courier New</button>
        <button data-font="Verdana" style="font-family:Verdana">Verdana</button>
        <button data-font="Comic Sans MS" style="font-family:'Comic Sans MS'">Comic Sans MS</button>
      </div>
    </div>
    <span class="tb-sep"></span>

    <div class="font-size-ctrl">
      <button class="tb-btn sm" data-cmd="fontsize-dec" title="Decrease font size"><span class="material-symbols-outlined">remove</span></button>
      <input class="fontsize-input" id="fontSizeInput" value="12" title="Font size" aria-label="Font size" />
      <button class="tb-btn sm" data-cmd="fontsize-inc" title="Increase font size"><span class="material-symbols-outlined">add</span></button>
    </div>
    <span class="tb-sep"></span>

    <button class="tb-btn fmt" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button class="tb-btn fmt" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button class="tb-btn fmt" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
    <button class="tb-btn fmt" data-cmd="strike" title="Strikethrough"><s>S</s></button>

    <div class="tb-dropdown" data-dropdown="color">
      <button class="tb-btn fmt color-btn" id="colorBtn" title="Text color"><span class="color-letter">A</span><span class="color-bar" id="colorBar"></span></button>
      <div class="tb-menu color-menu" id="colorMenu"></div>
    </div>
    <div class="tb-dropdown" data-dropdown="highlight">
      <button class="tb-btn fmt color-btn" id="highlightBtn" title="Highlight color"><span class="material-symbols-outlined">edit_note</span><span class="color-bar hl" id="highlightBar"></span></button>
      <div class="tb-menu color-menu" id="highlightMenu"></div>
    </div>

    <button class="tb-btn" data-cmd="link" title="Insert link (Ctrl+K)"><span class="material-symbols-outlined">link</span></button>
    <button class="tb-btn" data-cmd="image" title="Insert image"><span class="material-symbols-outlined">image</span></button>
    <span class="tb-sep"></span>

    <div class="tb-dropdown" data-dropdown="align">
      <button class="tb-btn" id="alignBtn" title="Align"><span class="material-symbols-outlined">format_align_left</span></button>
      <div class="tb-menu" id="alignMenu">
        <button data-align="justifyLeft"><span class="material-symbols-outlined">format_align_left</span> Left</button>
        <button data-align="justifyCenter"><span class="material-symbols-outlined">format_align_center</span> Center</button>
        <button data-align="justifyRight"><span class="material-symbols-outlined">format_align_right</span> Right</button>
        <button data-align="justifyFull"><span class="material-symbols-outlined">format_align_justify</span> Justify</button>
      </div>
    </div>
    <div class="tb-dropdown" data-dropdown="spacing">
      <button class="tb-btn" id="spacingBtn" title="Line spacing"><span class="material-symbols-outlined">format_line_spacing</span></button>
      <div class="tb-menu" id="spacingMenu">
        <button data-spacing="1">1.0</button>
        <button data-spacing="1.15">1.15</button>
        <button data-spacing="1.5">1.5</button>
        <button data-spacing="2">2.0</button>
      </div>
    </div>
    <button class="tb-btn" data-cmd="checklist" title="Checklist"><span class="material-symbols-outlined">checklist</span></button>
    <button class="tb-btn" data-cmd="bullets" title="Bulleted list"><span class="material-symbols-outlined">format_list_bulleted</span></button>
    <button class="tb-btn" data-cmd="numbering" title="Numbered list"><span class="material-symbols-outlined">format_list_numbered</span></button>
    <button class="tb-btn" data-cmd="outdent" title="Decrease indent"><span class="material-symbols-outlined">format_indent_decrease</span></button>
    <button class="tb-btn" data-cmd="indent" title="Increase indent"><span class="material-symbols-outlined">format_indent_increase</span></button>
    <button class="tb-btn" data-cmd="clear" title="Clear formatting"><span class="material-symbols-outlined">format_clear</span></button>
  </div>
  <div class="toolbar-right">
    <div class="tb-dropdown" data-dropdown="mode">
      <button class="tb-select" id="modeBtn"><span class="material-symbols-outlined">edit</span><span id="modeLabel">Editing</span><span class="material-symbols-outlined caret">arrow_drop_down</span></button>
      <div class="tb-menu right" id="modeMenu">
        <button data-mode="editing" class="active"><span class="material-symbols-outlined">edit</span> Editing</button>
        <button data-mode="suggesting"><span class="material-symbols-outlined">rate_review</span> Suggesting</button>
        <button data-mode="viewing"><span class="material-symbols-outlined">visibility</span> Viewing</button>
      </div>
    </div>
    <button class="icon-btn sm" id="collapseToolbar" title="Hide toolbar" aria-label="Hide toolbar"><span class="material-symbols-outlined">keyboard_arrow_up</span></button>
  </div>
</div>

<!-- ══════════ RULER ══════════ -->
<div class="ruler" id="ruler" aria-label="Document ruler">
  <div class="ruler-ticks" id="rulerTicks" aria-hidden="true"></div>
  <div class="ruler-marker left" id="markerLeft" role="slider" tabindex="0" aria-label="Left page margin" aria-orientation="horizontal" title="Left page margin"></div>
  <div class="ruler-marker right" id="markerRight" role="slider" tabindex="0" aria-label="Right page margin" aria-orientation="horizontal" title="Right page margin"></div>
</div>

<!-- ══════════ WORKSPACE ══════════ -->
<div class="workspace">
  <!-- Tabs panel -->
  <aside class="tabs-panel" id="tabsPanel">
    <button class="icon-btn panel-back" id="panelBack" title="Back" aria-label="Back"><span class="material-symbols-outlined">arrow_back</span></button>
    <div class="tabs-head">
      <span class="tabs-title">Document tabs</span>
      <button class="icon-btn sm" id="addRootTab" title="Add tab" aria-label="Add tab"><span class="material-symbols-outlined">add</span></button>
    </div>
    <div class="tabs-search">
      <span class="material-symbols-outlined">search</span>
      <input id="tabSearch" placeholder="Search tabs…" aria-label="Search tabs" />
      <button class="icon-btn sm hidden" id="clearSearch" title="Clear search"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="tabs-tree" id="tabsTree" role="tree" aria-label="Document tabs"></div>
    <div class="tabs-foot">
      <button class="tabs-foot-btn" id="expandAll"><span class="material-symbols-outlined">unfold_more</span> Expand all</button>
      <button class="tabs-foot-btn" id="collapseAll"><span class="material-symbols-outlined">unfold_less</span> Collapse all</button>
    </div>
    <div class="tabs-hint">Tip: hover a tab for <b>+</b> subtab · <b>⋮</b> for rename, duplicate, delete · drag to reorder</div>
  </aside>

  <!-- Editor -->
  <main class="editor-area" id="editorArea">
    <button class="toolbar-restore" id="toolbarRestore"><span class="material-symbols-outlined">keyboard_arrow_down</span> Show toolbar</button>
    <div class="mode-banner" id="modeBanner"><span class="material-symbols-outlined">rate_review</span><span>Suggesting mode — edits are made directly; review and approval are not available</span></div>
    <div class="findbar" id="findbar">
      <span class="material-symbols-outlined" style="color:var(--ink-3)">search</span>
      <input id="findInput" placeholder="Find in tab…" aria-label="Find in tab" />
      <span class="find-count" id="findCount"></span>
      <button class="icon-btn" id="findPrev" title="Previous (Shift+Enter)"><span class="material-symbols-outlined">keyboard_arrow_up</span></button>
      <button class="icon-btn" id="findNext" title="Next (Enter)"><span class="material-symbols-outlined">keyboard_arrow_down</span></button>
      <button class="icon-btn" id="findClose" title="Close (Esc)"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="crumbbar" id="crumbbar">
      <button class="panel-reopen" id="panelReopen" aria-label="Show tabs" aria-controls="tabsPanel" aria-expanded="false"><span class="material-symbols-outlined">view_sidebar</span><span>Tabs</span></button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="crumb-meta">
        <span id="saveStatus" class="save-status">Saved locally</span>
        <span class="crumb-sep">·</span>
        <span id="wordCount">0 words</span>
      </div>
    </div>
    <div class="page-scroll" id="pageScroll">
      <div class="scroll-fade" aria-hidden="true"></div>
      <div class="page-wrap" id="pageWrap">
        <div class="page" id="page" contenteditable="true" spellcheck="true" role="textbox" aria-label="Document editor"></div>
      </div>
    </div>
  </main>
</div>

<!-- ══════════ STATUS BAR ══════════ -->
<footer class="statusbar">
  <span class="status-item" id="statusTab">No tab selected</span>
  <span class="status-sep"></span>
  <span class="status-item" id="statusTabs">0 tabs</span>
  <span class="status-sep"></span>
  <span class="status-item" id="statusWords">0 words</span>
  <span class="status-spacer"></span>
  <span class="status-item status-hint">MegaDoc — all your notes in one document</span>
  <button class="status-btn" id="statusOutline" title="Outline"><span class="material-symbols-outlined">list</span> Outline</button>
</footer>

<!-- ══════════ CONTEXT MENU / MENUS / MODALS / TOASTS ══════════ -->
<div class="context-menu hidden" id="contextMenu" role="menu"></div>
<div class="menu-dropdown hidden" id="menuDropdown" role="menu"></div>
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden />

<script type="module" src="js/app.js?v=8"></script>
</body>
</html>
